version: 2
updates:
  # Maintain dependencies for npm monorepo workspaces
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated-pr"
    groups:
      dev-dependencies:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "typescript*"
          - "jest*"
          - "@types/*"
          - "ts-jest"
          - "supertest"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "@nestjs/*"
          - "next"
          - "react*"
          - "@prisma/*"
          - "zod"
        update-types:
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "actions"
    commit-message:
      prefix: "ci(actions)"
