name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brand_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brand_commerce"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brand_commerce?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: DTCG Design Token Validation
        run: npm run tokens:validate

      - name: WCAG 2.1 AA/AAA Contrast Audit
        run: npm run contrast:check

      - name: Automated Accessibility Audit (TASK-188)
        run: npm run a11y:audit

      - name: Architectural Fitness Functions (TASK-176)
        run: npm run arch:fitness

      - name: Architecture Fitness & Import Boundaries (TASK-180)
        run: npm run arch:boundaries

      - name: Consumer-Driven Contract Verification (TASK-183)
        run: npm run pact:verify

      - name: Figma Code Connect & Token Mapping (TASK-185)
        run: npm run figma:verify

      - name: Polyglot Governance & Zero DB Shared Writes (TASK-153/157)
        run: npm run polyglot:verify

      - name: Strangler Fig Extraction Simulation (TASK-152)
        run: npm run strangler:simulate

      - name: OpenTelemetry Semantic Conventions (TASK-158)
        run: npm run telemetry:verify

      - name: Performance Baselines & Budgets (TASK-160)
        run: npm run budget:check

      - name: Workflow Platform Saga Verification (TASK-151)
        run: npm run workflow:verify

      - name: PIM Regulatory Content Governance (TASK-113)
        run: npm run content:verify

      - name: AsyncAPI 3.1 Schema Validation (TASK-181)
        run: npm run asyncapi:validate

      - name: OpenAPI Spectral Linting (TASK-182)
        run: npm run openapi:lint

      - name: Visual Regression & Responsive Audit (TASK-186)
        run: npm run visual:audit

      - name: Agent Performance & Quality Metrics (TASK-187)
        run: npm run metrics:agent

      - name: Security & Secret Audit
        run: npm run security:audit

      - name: Supply Chain License Audit (TASK-190)
        run: npm run license:audit

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build (contracts → domain → api → storefront)
        run: npm run build

      - name: Apply migrations
        run: npm run migrate:deploy -w @bc/database

      - name: Seed sample data
        run: npm run prisma:seed

      - name: Unit + e2e tests (DB integration included)
        run: npm run test

      - name: Real-Service Integration Suite (TASK-184)
        run: npm run integration:real

      - name: API smoke (health + products)
        run: |
          node apps/api/dist/main.js &
          sleep 5
          curl -sf http://localhost:3001/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf "http://localhost:3001/api/v1/products?limit=3" | grep -q '"totalPages"'

      - name: Critical Journey Load Tests (TASK-193)
        run: npm run load:k6

      - name: Capacity Benchmark & Workload Verification (TASK-140)
        run: npm run capacity:benchmark

      - name: Regulatory Claim Expiry & Market Rules (TASK-144)
        run: npm run claim:enforce

      - name: OpenFeature Provider & Flag Governance (TASK-196)
        run: npm run flags:verify

      - name: Incident Response Tabletop Drill (TASK-138)
        run: npm run incident:tabletop

      - name: Data Migration Rehearsal & Financial Reconciliation (TASK-104)
        run: npm run migration:rehearse

      - name: Loyalty Points Ledger & Adverse Event Governance (TASK-092..098/133)
        run: npm run loyalty:verify

      - name: Export OpenAPI artifact (GAP-004)
        run: npm run openapi:export

      - name: Generate CycloneDX SBOM (TASK-190)
        run: npm run sbom:generate

      - name: Verify Release Artifact Provenance (TASK-192)
        run: node scripts/verify-provenance.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            apps/api/openapi.json
            docs/governance/SBOM.cdx.json
            docs/governance/PROVENANCE_MANIFEST.sha256
            docs/evidence/CAPACITY_BENCHMARK_REPORT.md
            docs/evidence/CLAIM_EXPIRY_REPORT.md
            docs/evidence/FEATURE_FLAG_POC_REPORT.md
            docs/evidence/INCIDENT_TABLETOP_REPORT.md
            docs/evidence/MIGRATION_REHEARSAL_REPORT.md
            docs/evidence/LOYALTY_GOVERNANCE_REPORT.md
